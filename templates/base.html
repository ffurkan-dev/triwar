<!DOCTYPE html>
{% load static %}
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Triwar{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="/">Triwar</a>
      <nav class="nav">
        {% if user.is_authenticated %}
          <a class="nav-link" href="{% url 'practice' %}">Harita testi</a>
          <span class="user">{{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-ghost btn-sm" type="submit">Çıkış</button></form>
        {% else %}
          <a class="btn btn-ghost btn-sm" href="{% url 'login' %}">Giriş yap</a>
          <a class="btn btn-sm" href="{% url 'register' %}">Kayıt ol</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
